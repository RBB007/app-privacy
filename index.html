<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>App Privacy Policies</title>
  <style>
    :root { --fg: #1b1b1f; --muted: #5d5d66; --bg: #ffffff; --rule: #e3e3e8; --accent: #c8102e; }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #ececf1; --muted: #a2a2ad; --bg: #141418; --rule: #2a2a31; }
    }
    body { margin: 0; background: var(--bg); color: var(--fg);
      font: 17px/1.55 -apple-system, system-ui, sans-serif; }
    main { max-width: 720px; margin: 0 auto; padding: 48px 20px 80px; }
    h1 { font-size: 2rem; margin: 0 0 8px; }
    p { color: var(--muted); }
    ul { list-style: none; padding: 0; margin: 28px 0 0; }
    li { padding: 14px 0; border-top: 1px solid var(--rule); }
    a { color: var(--accent); font-weight: 600; text-decoration: none; }
    a:hover { text-decoration: underline; }
    span { color: var(--muted); display: block; font-size: 0.95rem; }
  </style>
</head>
<body>
<main>
  <h1>App Privacy Policies</h1>
  <p>Privacy policies for iOS apps published by Bailey Bond.</p>
  <ul>
    <li><a href="roomsnap/">RoomSnap</a><span>LiDAR room scanning to floor plans</span></li>
  </ul>
</main>
</body>
</html>
